[package]
name = "kotoba"
version = "0.1.1"
description = "Entrenador pasivo de vocabulario japonés para Windows"
authors = ["Javier Ortuño Roig"]
license = "MIT"
repository = "https://github.com/JavierOrtunoRoig/kotoba"
edition = "2024"

[lib]
name = "kotoba_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
log = "0.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.43", features = ["bundled", "collation"] }
zip = "9"
zstd = "0.14"
sha1 = "0.11"
hex = "0.4"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
unicode-normalization = "0.1"
tempfile = "3"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
