[package]
name = "kotoba"
version = "0.1.0"
description = "Entrenador pasivo de vocabulario japonés para Windows"
authors = ["Javier"]
edition = "2024"

[lib]
name = "kotoba_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.43", features = ["bundled"] }
zip = "2"
zstd = "0.13"
sha1 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
unicode-normalization = "0.1"
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
