name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for example, v0.1.0)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check the tag and the version
        id: tag
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          if ($tag.TrimStart("v") -ne $version) {
            throw "La etiqueta $tag no coincide con la versión $version de src-tauri/tauri.conf.json"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          uploadUpdaterJson: true
          # The updater uses the NSIS build (per-user install, no admin). The MSI remains available
          # as a manual download.
          updaterJsonPreferNsis: true
          releaseName: "kotoba ${{ steps.tag.outputs.tag }}"
          releaseBody: |
            kotoba ${{ steps.tag.outputs.tag }} installers for Windows 10 and 11 (x64).

            - **NSIS (recommended)**: `kotoba_${{ steps.tag.outputs.version }}_x64-setup.exe`
            - **MSI**: `kotoba_${{ steps.tag.outputs.version }}_x64_en-US.msi`

            The NSIS build installs per user, without administrator permissions, and is the format
            used by the automatic updater. The MSI is the classic Windows installer.

            After this version, kotoba checks for updates on startup and from
            Settings → System.

            The binaries are **not digitally signed**, so SmartScreen may ask for
            confirmation the first time. The source code for this version is in the
            `${{ steps.tag.outputs.tag }}` tag.

            WebView2 ships with Windows 11 and most Windows 10 machines; if it is
            missing, the installer can download it.
          releaseDraft: false
          prerelease: false

      - name: Update the release with the English changelog
        if: success()
        shell: pwsh
        run: pwsh .github/scripts/update-release-body.ps1 -Version "${{ steps.tag.outputs.version }}"
